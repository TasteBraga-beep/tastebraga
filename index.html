<!-- Formulaire de Code Promo TasteBraga (Géré par Netlify Forms) -->
<form name="codigo-desconto" method="POST" data-netlify="true" class="promo-form">
  <!-- Champ caché requis par Netlify -->
  <input type="hidden" name="form-name" value="codigo-desconto" />
  
  <h3>🎟️ Obter Desconto Exclusivo TasteBraga</h3>
  <p>Preencha para receber o seu código e apresentar no restaurante:</p>

  <label for="nome">Seu Nome:</label>
  <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required />

  <label for="whatsapp">Seu WhatsApp / E-mail:</label>
  <input type="text" id="whatsapp" name="contacto" placeholder="Ex: 912345678" required />

  <label for="restaurante">Restaurante / Prato:</label>
  <input type="text" id="restaurante" name="restaurante" value="Francesinha / Bacalhau" readonly />

  <!-- Destinataire de notification ou suivi -->
  <input type="hidden" name="email_destino" value="tastebraga@gmail.com" />

  <button type="submit" class="btn-promo">Obter Código de Desconto 🚀</button>
</form>
